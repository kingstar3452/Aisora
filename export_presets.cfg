[preset.0]

name="macOS"
platform="macOS"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="assets/world/*.webp,assets/world/manifest.json"
exclude_filter="docs/*,tests/*,tools/*,browser-controller/*,.local/*"
export_path="exports/Aisora.zip"
script_export_mode=2

[preset.0.options]

custom_template/debug="res://.local/export-templates/macos-intel.zip"
custom_template/release="res://.local/export-templates/macos-intel.zip"

binary_format/architecture="x86_64"
application/bundle_identifier="local.aisora.companion"
; Raw export only: tools/export_macos.py finishes and re-signs the complete bundle.
codesign/codesign=0
notarization/notarization=0

