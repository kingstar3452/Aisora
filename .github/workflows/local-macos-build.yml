name: Private preview and source-ZIP Mac build (no publication)
on:
  push:
    branches: [ci/aisora-local-build]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  local-build:
    runs-on: macos-15-intel
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.27.3'
          cache: false
      - name: Stage the already-verified binary into PRIVATE versioned draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, subprocess
          from pathlib import Path
          repo = os.environ['GITHUB_REPOSITORY']
          assert repo == 'kingstar3452/Aisora'
          target = json.loads(subprocess.check_output(['gh', 'api', f'repos/{repo}/releases/421423152']))
          assert target['draft'] and target['tag_name'] == 'v6.1.0-rc.2'
          work = Path('.local/private-preview'); work.mkdir(parents=True)
          archive = work / 'Aisora-phase6-macos.zip'
          with archive.open('wb') as out:
              subprocess.run(['gh', 'api', '-H', 'Accept: application/octet-stream', f'repos/{repo}/releases/assets/666951269'], stdout=out, check=True)
          sha = '263dddb013d59a6207cd76a67f8d694f861e8e9ef224aba418e667598dd6710b'
          assert archive.stat().st_size == 60018823 and hashlib.sha256(archive.read_bytes()).hexdigest() == sha
          checksum = work / (archive.name + '.sha256'); checksum.write_text(sha + '  ' + archive.name + '\n')
          existing = {x['name'] for x in target['assets']}
          files = [archive, checksum, Path('docs/benchmarks/rc2/native-macos-validation.json'), Path('docs/benchmarks/rc2/native-zip-verification-linux.json')]
          # Refuse replacement. The original native draft is untouched.
          missing = [str(x) for x in files if x.name not in existing]
          if missing:
              subprocess.run(['gh', 'release', 'upload', 'v6.1.0-rc.2', *missing, '--repo', repo], check=True)
          assert json.loads(subprocess.check_output(['gh', 'api', f'repos/{repo}/releases/421423152']))['draft']
          print('Exact previously tested archive copied to PRIVATE DRAFT only; no publication.')
          PY
      - name: Install pinned official Godot editor
        run: python3 tools/validate_macos_ci.py bootstrap
      - name: Focused source-ZIP build without git or Xcode
        run: python3 tools/check_local_build_ci.py
      - name: Save focused evidence to PRIVATE draft only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          repo = os.environ['GITHUB_REPOSITORY']
          info = json.loads(subprocess.check_output(['gh', 'api', f'repos/{repo}/releases/421423152']))
          assert repo == 'kingstar3452/Aisora' and info['draft'] and info['tag_name'] == 'v6.1.0-rc.2'
          source = Path('.local/local-build-ci/local-source-build-report.json')
          target = source.with_name('local-source-build-' + os.environ['GITHUB_RUN_ID'] + '.json')
          target.write_bytes(source.read_bytes())
          subprocess.run(['gh', 'release', 'upload', 'v6.1.0-rc.2', str(target), '--repo', repo], check=True)
          PY
